# Publica a Galáxia de Embeddings no GitHub Pages.
# Requer: Settings → Pages → Source = "GitHub Actions".
name: Galáxia · GitHub Pages

on:
  push:
    branches: [main]
    paths: ["galaxia/web/**", ".github/workflows/galaxia-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: galaxia/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: galaxia/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: galaxia/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
